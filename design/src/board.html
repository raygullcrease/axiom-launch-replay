<!doctype html>
<meta charset="utf-8">
<title>Brand board</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  .b { position: absolute; inset: 0; padding: 56px; display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: min-content; gap: 44px 28px; }
  section h2 { margin: 0 0 18px; font-size: 15px; font-weight: 600; color: var(--color-text-muted); letter-spacing: -0.008em; }
  .logo { grid-column: span 5; }
  .logo img { height: 96px; display: block; }
  .logo p { margin: 22px 0 0; font: 600 32px/1.14 var(--font-display); letter-spacing: -0.026em; }
  .sizes { grid-column: span 7; }
  .sizes .r { display: flex; align-items: flex-end; gap: 26px; }
  .sizes small { display: block; margin-top: 8px; text-align: center; font-size: 12px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .color { grid-column: span 7; }
  .ch { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .c { border-radius: 12px; height: 92px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; font-weight: 600; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .c small { font-weight: 500; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .grad { height: 76px; margin-top: 10px; border-radius: 12px; background: var(--gradient-free); display: flex; align-items: flex-end; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #000; }
  .type { grid-column: span 5; }
  .type .d { font: 600 56px/1.04 var(--font-display); letter-spacing: -0.034em; margin-bottom: 14px; }
  .type .t { font-size: 17px; line-height: 1.42; color: var(--color-text-muted); letter-spacing: -0.012em; max-width: 44ch; }
</style>
<div class="b">
  <section class="logo"><h2>Logo</h2><img src="../../assets/brand/logo-white.svg" alt=""><p id="tag"></p></section>
  <section class="sizes"><h2>App icon</h2><div class="r" id="sizes"></div></section>
  <section class="color"><h2>Color</h2><div class="ch" id="ch"></div></section>
  <section class="type"><h2>Type</h2><div class="d" id="d"></div><div class="t">SF Pro on Apple devices, Inter everywhere else, tabular figures for every number, and a monospace face for addresses. Amber means proof: results after every cost.</div></section>
</div>
<script src="kit.js"></script>
<script>
  const { headline, sub, swatches, gradientNote } = Kit.BRAND;
  document.getElementById('tag').textContent = sub;
  document.getElementById('d').textContent = headline;
  
  document.getElementById('sizes').innerHTML = [[160, false], [96, false], [64, false], [48, true], [32, true], [24, true], [16, true]]
    .map(([s, small], i) => `<div>${Kit.iconSVG({ size: s, small, uid: 'z' + i })}<small>${s}</small></div>`).join('');
  document.getElementById('ch').innerHTML = swatches.map(([hex, label, ink]) => `<div class="c" style="background:${hex};color:${ink}">${label}<small>${hex.toUpperCase()}</small></div>`).join('');
</script>
