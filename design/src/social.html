<title>Social preview</title>

<link rel="stylesheet" href="ui.css">

  h1 { margin: 22px 0 0; font: 600 72px/1.06 var(--font-display); letter-spacing: -0.032em; }
  p { margin: 14px 0 0; font-size: 26px; color: var(--color-text-muted); letter-spacing: -0.014em; }

  document.getElementById('i').innerHTML = Kit.iconSVG({ size: 180, uid: 's' });

  document.getElementById('b').textContent = Kit.BRAND.sub;
